services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ledger
      POSTGRES_PASSWORD: ledger
      POSTGRES_DB: ledger
    ports:
      - "5433:5432" # 5433 on the host so it doesn't clash with a local Postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./docker/create-test-db.sql:/docker-entrypoint-initdb.d/create-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ledger -d ledger"]
      interval: 2s
      timeout: 3s
      retries: 20

  # Optional: run the API itself in Docker (no local Python needed).
  #   docker compose --profile app up --build
  api:
    profiles: ["app"]
    build: .
    environment:
      DATABASE_URL: postgresql://ledger:ledger@db:5432/ledger
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
